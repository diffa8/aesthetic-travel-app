<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Difa & Iann Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #fffafc; color: #92003A; }
        .text-custom-bold { color: #92003A !important; }
        .text-sub { color: #b83b60 !important; }
        .btn-custom-main { background: linear-gradient(135deg, #92003A, #F62477); border: none; color: #fff; font-weight: 600; }
        .btn-custom-main:hover { background: linear-gradient(135deg, #78002e, #d41d64); color: #fff; }
        .card-custom { border-radius: 20px; border: 2px solid #ffadee; background-color: #ffffff; box-shadow: 0 4px 15px rgba(246, 36, 119, 0.08); }
        .badge-custom { background-color: #ffadee; color: #92003A; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container py-5" style="max-width: 600px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-custom-bold mt-1">Daftar Liburan & Trip</h3>
            <p class="text-sub small fw-semibold">Pilih trip yang mau dikunjungi atau buat destinasi baru</p>
        </div>

        <!-- List Trip -->
        <div class="list-group shadow-sm mb-4" style="border-radius: 15px; overflow: hidden; border: 1px solid #ffadee;">
            {% for trip in trips %}
            <div class="list-group-item p-3 d-flex justify-content-between align-items-center border-0 border-bottom bg-white">
                <a href="/trip/{{ trip['id'] }}" class="flex-grow-1" style="text-decoration: none;">
                    <span class="badge badge-custom mb-1 px-2 py-1">{{ trip['destination'] }}</span>
                    <h5 class="fw-bold mb-0 text-custom-bold">{{ trip['title'] }}</h5>
                    <small class="text-sub fw-semibold">Target: Rp {{ "{:,}".format(trip['target_budget']).replace(",", ".") }}</small>
                </a>
                <div class="d-flex gap-2">
                    <a href="/trip/{{ trip['id'] }}/edit" class="btn btn-sm btn-outline-secondary py-1 px-2" style="font-size: 0.8rem;">Edit</a>
                    <a href="/trip/{{ trip['id'] }}/delete" class="btn btn-sm btn-outline-danger py-1 px-2" style="font-size: 0.8rem;" onclick="return confirm('Yakin mau Hapus trip ini?')">Hapus</a>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Form Tambah Trip Baru -->
        <div class="card shadow-sm card-custom p-4">
            <h6 class="fw-bold mb-3 text-custom-bold">Buat Destinasi / Trip Baru</h6>
            <form action="/add_trip" method="POST">
                <div class="mb-2">
                    <input type="text" class="form-control rounded-pill px-3 text-custom-bold" name="destination" placeholder="Kota Tujuan" required style="background-color: #fffafc; border-color: #ffadee;">
                </div>
                <div class="mb-2">
                    <input type="text" class="form-control rounded-pill px-3 text-custom-bold" name="title" placeholder="Nama Trip" required style="background-color: #fffafc; border-color: #ffadee;">
                </div>
                <div class="mb-3">
                    <input type="number" class="form-control rounded-pill px-3 text-custom-bold" name="target_budget" placeholder="Target Total Budget" required style="background-color: #fffafc; border-color: #ffadee;">
                </div>
                <button type="submit" class="btn btn-custom-main w-100 rounded-pill shadow-sm">Buat Trip Baru</button>
            </form>
        </div>
    </div>
</body>
</html>
